plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.4.10'
    id 'com.github.johnrengelman.shadow' version '6.0.0'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'application'

archivesBaseName = 'client'
mainClassName = 'org.rs09.client.GameLaunch'
group = 'org.rs09'
version = '1.0.0'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.4.10'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    implementation 'com.github.ajalt.mordant:mordant:2.0.0-alpha2'

    implementation 'org.jetbrains:markdown:0.2.4'

    implementation files(
        'libs/gluegen-rt.jar', 'libs/gluegen-rt-natives-windows-i586.jar', 'libs/gluegen-rt-natives-windows-amd64.jar', 'libs/gluegen-rt-natives-macosx-universal.jar', 'libs/gluegen-rt-natives-linux-i586.jar', 'libs/gluegen-rt-natives-linux-amd64.jar'
    )
    
    implementation files(
        'libs/jogl-all.jar', 'libs/jogl-all-natives-windows-i586.jar', 'libs/jogl-all-natives-windows-amd64.jar', 'libs/jogl-all-natives-macosx-universal.jar', 'libs/jogl-all-natives-linux-i586.jar', 'libs/jogl-all-natives-linux-amd64.jar'
    )

    implementation files('libs/discord-rpc.jar')
}

compileKotlin {
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'org.rs09.client.GameLaunch'
    }
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}